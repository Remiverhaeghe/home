name: Captures

# Captures d'écran d'une maison fictive (test/captures), en artefact : pour le README, le
# portfolio et pour relire l'interface sans téléphone.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/ui/**"
      - "lib/app.dart"
      - "lib/l10n/**"
      - "test/captures/**"
      - ".github/workflows/captures.yml"

permissions:
  contents: read

# Un nouveau commit sur la branche rend le passage précédent inutile : il est arrêté.
concurrency:
  group: captures-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  captures:
    name: Captures d'écran
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Captures
        run: |
          flutter pub get
          flutter gen-l10n
          export FLUTTER_ROOT="$(dirname "$(dirname "$(command -v flutter)")")"
          flutter test --tags captures --run-skipped --update-goldens test/captures

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures
          path: test/captures/png/*.png
          if-no-files-found: warn
