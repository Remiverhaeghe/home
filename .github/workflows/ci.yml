name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions épinglées par empreinte de commit ; Dependabot propose les nouvelles versions.

# Sur une branche, un nouveau commit (la mise en forme automatique par exemple) rend les
# contrôles du précédent inutiles : ils sont arrêtés. Sur main, jamais.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

jobs:
  analyse:
    name: Analyse
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Installation des dépendances
        run: flutter pub get

      - name: Textes traduits
        run: flutter gen-l10n

      # Largeur des lignes fixée dans analysis_options.yaml ; en cas d'écart, le
      # diff affiché donne la forme attendue.
      - name: Vérification du formatage
        run: |
          dart format lib test
          git diff --exit-code -- lib test

      - name: Analyse du code
        run: flutter analyze

  tests:
    name: Tests et couverture
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Installation des dépendances
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Tests
        run: flutter test --coverage

      # Les règles (lib/logic) doivent être couvertes à 95 % au moins ; le seuil se relève
      # avec le temps, il ne baisse jamais pour faire passer un commit.
      - name: Couverture des règles
        run: |
          awk -v vMin=95 '
            /^SF:/ { vKeep = (substr($0, 4) ~ /^lib\/logic\//) }
            vKeep && /^DA:/ {
              split(substr($0, 4), vPart, ",")
              vFound++
              if (vPart[2] > 0) vCovered++
            }
            END {
              vPercent = vFound ? 100 * vCovered / vFound : 100
              printf "Couverture de lib/logic : %.1f %% (%d lignes sur %d), minimum %d %%\n", vPercent, vCovered, vFound, vMin
              exit (vPercent < vMin)
            }' coverage/lcov.info

  apk:
    name: APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      signed: ${{ steps.signature.outputs.signed }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Java 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      # Seuls build.gradle.kts et le manifeste sont versionnés : le reste du
      # dossier android (Gradle, icônes, MainActivity) est recréé ici.
      - name: Fichiers Android
        run: |
          flutter create --platforms=android --org fr.remiverhaeghe --project-name home .
          flutter pub get
          flutter gen-l10n

      # Signature avec la clé personnelle si les secrets existent : l'APK remplace alors celle
      # déjà installée. Sinon, clé de débogage, propre à chaque construction.
      - name: Clé de signature
        id: signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            {
              echo "storePassword=$STORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "Signature avec la clé personnelle"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Secrets absents : signature avec la clé de débogage"
          fi

      - name: Construction
        run: |
          # Hors de main, seule l'APK arm64 sert : les autres architectures ne sont construites
          # que pour être publiées
          vAbi=""
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            vAbi="--target-platform android-arm64"
          fi
          # Numéro de construction croissant : Android refuse une mise à jour dont le
          # versionCode n'augmente pas
          flutter build apk --release --split-per-abi $vAbi --build-number="$GITHUB_RUN_NUMBER"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: home-apk
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

  # Chaque fusion sur main publie l'APK dans une préversion « build-N » : Obtainium, sur le
  # téléphone, la voit et propose la mise à jour. Seulement avec la clé personnelle, sinon
  # chaque APK aurait une signature différente et ne remplacerait pas la précédente.
  derniere:
    name: Préversion pour Obtainium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [tests, apk]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.apk.outputs.signed == 'true'
    permissions:
      contents: write
    concurrency:
      group: preversion
      cancel-in-progress: false

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: home-apk
          path: apk

      - name: Publication et ménage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: build-${{ github.run_number }}
        run: |
          gh release create "$TAG" apk/*.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Home, construction ${{ github.run_number }}" \
            --notes "APK construite depuis main ($GITHUB_SHA). Installation et mises à jour : README, section « Installer sur le téléphone »."
          # Les trois dernières préversions suffisent : les plus anciennes et leur tag sont supprimés
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("build-")))] | .[3:] | .[].tagName' |
            while read -r vTag; do
              gh release delete "$vTag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done

  secrets:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
