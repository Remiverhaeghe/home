name: home
description: Suivre la température et l'humidité de la maison, hors ligne, sur le téléphone.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  # Dossier de l'application, où vit le fichier des capteurs
  path_provider: ^2.1.4
  # Import d'un fichier d'échange JSON
  file_picker: ^13.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
