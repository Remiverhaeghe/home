name: home
description: Suivre la température et l'humidité de la maison, hors ligne, sur le téléphone.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  # Dossier de l'application, où vit le fichier des capteurs
  path_provider: ^2.1.4
  # Import d'un fichier d'échange JSON
  file_picker: ^13.3.3
  # Thermo-hygromètres ThermoPro en Bluetooth basse consommation, et l'accord pour le Bluetooth
  # 5.6 et plus : compile contre le SDK Android 37 (voir compileSdk de l'appli)
  flutter_reactive_ble: ^5.6.0
  permission_handler: ^13.0.2
  # Relevé des capteurs toutes les 5 minutes, appli fermée : service de premier plan Android
  flutter_foreground_task: ^11.0.3
  # Alertes de gel, d'humidité et de capteur muet : notification avec son et bannière
  flutter_local_notifications: ^20.1.0
  # Affichage mural : l'écran reste allumé tant que la tablette est accrochée
  wakelock_plus: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Notes de version affichées dans « À propos »
  assets:
    - CHANGELOG.md
  generate: true
